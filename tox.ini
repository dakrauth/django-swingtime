[tox]
isolated_build = true
skip_missing_interpreters = true
parallel_show_output = true
envlist =
    py{310,311}-django52
    py{312,313,314}-django{52,60}
    py{312,313,314}-djmain

[testenv]
skip_install = true
allowlist_externals =
    pytest
commands =
    pip install -e .[test]
    pytest --cov-config .coveragerc --cov-report html --cov-report term --cov=swingtime tests
setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
    PYTHONPATH={toxinidir}
    PYTHONHASHSEED=0
deps =
    pytest
    pytest-django
    django52: Django>5.2,<6.0
    django62: Django>6.0,<6.1
    djmain: https://github.com/django/django/archive/main.tar.gz

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

